<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Resolume</title>
  <link rel="stylesheet" href="sdpi.css">
</head>

<script src="sdtools.common.js"></script>

<body>
  <div class="sdpi-wrapper">
    <div id="host-configs">
        <div class="host-config">
          <div class="sdpi-heading">Settings</div>
          
          <div class="sdpi-item">
            <div class="sdpi-item-label">Host/IP</div>
            <div class="sdpi-item-child">
              <input class="sdProperty" id="host" type="text" value="localhost" onInput="setSettings()">
            </div>
          </div>

          <div class="sdpi-item">
            <div class="sdpi-item-label">Port</div>
            <div class="sdpi-item-child">
              <input class="sdProperty" id="port" type="number" value="8080" onInput="setSettings()">
            </div>
          </div>

          <div class="sdpi-item">
            <div class="sdpi-item-label">Layer</div>
            <div class="sdpi-item-child">
              <input class="sdProperty" id="layer" type="number" value="1" onInput="setSettings()">
            </div>
          </div>

          <div class="sdpi-item">
            <div class="sdpi-item-label">Clip(Column)</div>
            <div class="sdpi-item-child">
              <input class="sdProperty" id="clip" type="number" value="1" onInput="setSettings()">
            </div>
          </div>

        </div>
    </div>
  </div>

</body>
</html>
